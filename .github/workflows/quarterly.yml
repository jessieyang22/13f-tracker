name: Quarterly 13F report

# 13F filings are due 45 days after each quarter ends (mid Feb/May/Aug/Nov).
# This runs a few days after each deadline and commits the new report.
on:
  schedule:
    - cron: "0 14 18 2,5,8,11 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tracker.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "Add 13F report for latest quarter"
          git push
